<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAK 3D karta</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
<style>
  :root {
    --bg: rgba(15,20,32,.86); --bg2: rgba(255,255,255,.05); --line: rgba(255,255,255,.09);
    --text: #e9eef7; --muted: #8b98b0; --accent: #5aa0ff; --danger: #e5484d; --ok: #3fcf8e;
  }
  html, body { margin: 0; height: 100%; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b1220; color: var(--text); }
  #cesium { position: absolute; inset: 0; }
  .card { background: var(--bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  /* ---- lijevi panel ---- */
  #panel { position: absolute; top: 12px; left: 12px; bottom: 36px; width: 300px; display: flex; flex-direction: column; z-index: 5; overflow: hidden; }
  #panel.collapsed { bottom: auto; }
  #panel.collapsed #body { display: none; }
  .head { display: flex; align-items: center; gap: 8px; padding: 11px 12px; }
  .head h1 { font-size: 14px; font-weight: 650; margin: 0; flex: 1; letter-spacing: .2px; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.ok i { background: var(--ok); box-shadow: 0 0 0 3px rgba(63,207,142,.18); }
  .pill.bad i { background: var(--danger); box-shadow: 0 0 0 3px rgba(229,72,77,.2); }
  .icon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
  .icon:hover { background: var(--bg2); color: var(--text); }
  #body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #banner { margin: 0 12px 8px; padding: 8px 10px; border-radius: 8px; background: rgba(229,72,77,.14); color: #ffb4b6; font-size: 12px; }
  #banner[hidden] { display: none; }
  #search { margin: 0 12px 8px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  .tabs { display: flex; gap: 4px; margin: 0 12px 8px; padding: 3px; background: var(--bg2); border-radius: 8px; }
  .tabs button { flex: 1; padding: 5px 0; border-radius: 6px; color: var(--muted); font-size: 12px; }
  .tabs button.on { background: rgba(255,255,255,.12); color: var(--text); }
  #list { flex: 1; overflow-y: auto; margin: 0; padding: 0 6px 6px; list-style: none; }
  #list li { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 8px; cursor: pointer; }
  #list li:hover { background: var(--bg2); }
  #list li.sel { background: rgba(90,160,255,.16); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .nm { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { min-width: 0; flex: 1; }
  .empty { padding: 22px 12px; text-align: center; color: var(--muted); }
  .foot { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11.5px; }
  .foot a, .link { color: var(--accent); text-decoration: none; background: none; }
  .foot a:hover, .link:hover { text-decoration: underline; }

  /* ---- detalji ---- */
  #detail { position: absolute; top: 12px; right: 12px; width: 300px; max-height: calc(100% - 60px); overflow-y: auto; z-index: 5; padding: 14px; }
  #detail[hidden] { display: none; }
  .dhead { display: flex; align-items: flex-start; gap: 10px; }
  .dhead .grow { padding-top: 1px; }
  #dName { font-size: 16px; font-weight: 650; }
  .badge { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--bg2); color: var(--muted); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 4px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; word-break: break-word; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .btn { flex: 1; padding: 8px 10px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); text-align: center; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.danger { color: #ff8a8e; border-color: rgba(229,72,77,.4); }
  .btn.danger:hover { background: rgba(229,72,77,.16); }
  .btn:disabled { opacity: .5; cursor: default; }
  #dMsg { margin-top: 10px; font-size: 12px; color: var(--muted); word-break: break-word; }
  #dMsg.err { color: #ffb4b6; }
  #dMsg.ok { color: var(--ok); }
  details.raw { margin-top: 12px; }
  details.raw summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  #dPre { margin: 8px 0 0; max-height: 240px; overflow: auto; background: rgba(0,0,0,.35); border-radius: 8px; padding: 8px; font: 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; color: #c9d6ee; }

  @media (max-width: 800px) { #detail { top: auto; bottom: 36px; left: 12px; right: 12px; width: auto; max-height: 45%; } #panel { width: calc(100% - 24px); bottom: auto; max-height: 45%; } }
</style>
</head>
<body>
<div id="cesium"></div>

<div id="panel" class="card">
  <div class="head">
    <h1>TAK karta</h1>
    <span class="pill" id="pill"><i></i><span id="pillText">Spajam…</span></span>
    <button class="icon" id="zoomAll" type="button" title="Prikaži sve">⌖</button>
    <button class="icon" id="collapse" type="button" title="Sakrij/prikaži popis">▾</button>
  </div>
  <div id="body">
    <div id="banner" hidden></div>
    <input id="search" type="search" placeholder="Traži…" autocomplete="off">
    <div class="tabs" id="tabs">
      <button type="button" data-f="all" class="on">Sve</button>
      <button type="button" data-f="eud">Uređaji</button>
      <button type="button" data-f="marker">Markeri</button>
    </div>
    <ul id="list"></ul>
    <label class="foot" style="justify-content:flex-start;gap:8px;border-top:0;padding-bottom:0;cursor:pointer"><input type="checkbox" id="stale"> Prikaži istekle markere</label>
    <div class="foot"><span id="upd">—</span><a href="/api/debug" target="_blank" rel="noopener">debug</a></div>
  </div>
</div>

<div id="detail" class="card" hidden>
  <div class="dhead">
    <span class="dot" id="dDot" style="margin-top:5px"></span>
    <div class="grow">
      <div id="dName"></div>
      <span class="badge" id="dBadge"></span>
    </div>
    <button class="icon" id="dClose" type="button" title="Zatvori">✕</button>
  </div>
  <dl id="dInfo"></dl>
  <div class="row">
    <button class="btn" id="dFly" type="button">Približi</button>
    <button class="btn danger" id="dDelete" type="button" hidden>Obriši</button>
  </div>
  <div id="dMsg"></div>
  <details class="raw">
    <summary>Sva polja iz API-ja</summary>
    <pre id="dPre"></pre>
  </details>
</div>

<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const panel = $('panel'), listEl = $('list'), pill = $('pill'), pillText = $('pillText'), banner = $('banner');
  const dEl = $('detail'), dMsg = $('dMsg'), dDelete = $('dDelete');

  let cfg = { ionToken: '', pollMs: 2000 };
  try { cfg = await (await fetch('/config')).json(); } catch (e) { /* zadano */ }
  const MARKERS = cfg.markersPath || '/api/markers';

  const hasToken = !!cfg.ionToken;
  if (hasToken) Cesium.Ion.defaultAccessToken = cfg.ionToken;

  const viewerOptions = {
    animation: false, timeline: false, geocoder: false, homeButton: false, fullscreenButton: false,
    sceneModePicker: false, navigationHelpButton: false, baseLayerPicker: hasToken,
    infoBox: false, selectionIndicator: false,
  };
  if (hasToken) viewerOptions.terrain = Cesium.Terrain.fromWorldTerrain();
  else {
    viewerOptions.baseLayer = new Cesium.ImageryLayer(
      new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' }));
    viewerOptions.baseLayerPicker = false;
  }
  const viewer = new Cesium.Viewer('cesium', viewerOptions);
  viewer.scene.globe.depthTestAgainstTerrain = true;
  if (hasToken) {
    try { viewer.scene.primitives.add(await Cesium.createOsmBuildingsAsync()); }
    catch (e) { console.warn('OSM zgrade nisu ucitane:', e); }
  }

  // ---- pomocne ----
  const COLORS = { f: '#4cc9f0', h: '#ff5d5d', n: '#5dd39e', u: '#ffd166' };
  const AFFIL = { f: 'Prijatelj', h: 'Neprijatelj', n: 'Neutralno', u: 'Nepoznato' };
  const affil = (t) => /^a-([fhnu])/.exec(String(t || ''))?.[1];
  const cssColor = (t) => COLORS[affil(t)] || '#d5dbe8';
  const offline = (it) => it.info?.Status && it.info.Status !== 'Connected';
  const itColor = (it) => (offline(it) ? '#7d889d' : cssColor(it.type));
  const colorFor = (it) => Cesium.Color.fromCssColorString(itColor(it));
  let showStale = false;
  const isStale = (it) => kindOf(it) === 'marker' && it.stale && Date.parse(it.stale) < Date.now();
  const isVisible = (it) => showStale || !isStale(it);
  const isAir = (t) => /^a-.-A/.test(String(t || ''));
  const kindOf = (it) => ((it.from || []).includes(MARKERS) ? 'marker' : 'eud');
  const kindLabel = (it) => (kindOf(it) === 'marker' ? 'Marker' : 'Uređaj');
  function typeLabel(it) {
    const a = AFFIL[affil(it.type)];
    const air = isAir(it.type) ? 'zračni' : '';
    return [kindLabel(it), a, air].filter(Boolean).join(' · ');
  }
  function ago(t) {
    const ms = Date.parse(t);
    if (!t || Number.isNaN(ms)) return null;
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return `prije ${s} s`;
    if (s < 3600) return `prije ${Math.round(s / 60)} min`;
    if (s < 86400) return `prije ${Math.round(s / 3600)} h`;
    return new Date(ms).toLocaleString('hr-HR');
  }

  // ---- entiteti na karti ----
  const entities = new Map();
  let items = [];
  let firstFit = true;
  let selectedId = null;
  let filter = 'all', query = '';

  function upsert(item) {
    const color = colorFor(item);
    const air = isAir(item.type) && item.alt !== null;
    const position = Cesium.Cartesian3.fromDegrees(item.lon, item.lat, air ? item.alt : 0);
    const hRef = air ? Cesium.HeightReference.NONE : Cesium.HeightReference.CLAMP_TO_GROUND;
    let e = entities.get(item.id);
    if (!e) {
      e = viewer.entities.add({
        id: item.id, position,
        point: { pixelSize: 12, color, outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
                 heightReference: hRef, disableDepthTestDistance: Number.POSITIVE_INFINITY },
        label: { text: item.name, font: '600 13px system-ui, sans-serif', fillColor: Cesium.Color.WHITE,
                 showBackground: true, backgroundColor: Cesium.Color.fromCssColorString('rgba(15,20,32,0.75)'),
                 backgroundPadding: new Cesium.Cartesian2(7, 4),
                 pixelOffset: new Cesium.Cartesian2(0, -22), heightReference: hRef,
                 distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 60000),
                 disableDepthTestDistance: Number.POSITIVE_INFINITY },
      });
      entities.set(item.id, e);
    } else {
      e.position = position;
      e.point.color = color;
      e.point.heightReference = hRef;
      e.label.heightReference = hRef;
      e.label.text = item.name;
    }
    e.point.pixelSize = item.id === selectedId ? 16 : 12;
  }

  // ---- popis ----
  function renderList() {
    const q = query.trim().toLowerCase();
    const shown = items.filter(isVisible).filter((it) =>
      (filter === 'all' || kindOf(it) === filter) &&
      (!q || it.name.toLowerCase().includes(q) || String(it.id).toLowerCase().includes(q)));
    listEl.textContent = '';
    if (!shown.length) {
      const d = document.createElement('li');
      d.className = 'empty'; d.style.cursor = 'default';
      d.textContent = items.length ? 'Nema rezultata.' : 'Nema objekata na serveru.';
      listEl.appendChild(d);
      return;
    }
    for (const it of shown) {
      const li = document.createElement('li');
      if (it.id === selectedId) li.className = 'sel';
      const dot = document.createElement('span');
      dot.className = 'dot'; dot.style.background = itColor(it);
      const wrap = document.createElement('div'); wrap.className = 'grow';
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = it.name;
      const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = typeLabel(it);
      wrap.append(nm, sub); li.append(dot, wrap);
      li.addEventListener('click', () => select(it.id, true));
      listEl.appendChild(li);
    }
  }

  // ---- detalji ----
  function fillDetail(it) {
    $('dName').textContent = it.name;
    $('dBadge').textContent = typeLabel(it);
    $('dDot').style.background = itColor(it);
    const rows = [
      ...Object.entries(it.info || {}),
      ['Položaj', `${it.lat.toFixed(5)}, ${it.lon.toFixed(5)}`],
      ['Visina', it.alt !== null ? `${Math.round(it.alt)} m` : null],
      [kindOf(it) === 'marker' ? 'Postavljen' : 'Zadnje javljanje', ago(it.time)],
      ['Položaj od', it.posTime ? ago(it.posTime) : null],
      ['Istječe', it.stale ? (isStale(it) ? 'istekao' : new Date(it.stale).toLocaleString('hr-HR')) : null],
      ['CoT tip', it.type],
      ['ID', it.id],
    ].filter(([, v]) => v);
    const dl = $('dInfo');
    dl.textContent = '';
    for (const [k, v] of rows) {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    }
    $('dPre').textContent = JSON.stringify({ izvori: it.from || [], sirovi_odgovori: it.raws || {} }, null, 2);
    dDelete.hidden = kindOf(it) !== 'marker';
  }

  function select(id, fly) {
    selectedId = id;
    const it = items.find((i) => i.id === id);
    if (!it) { deselect(); return; }
    dEl.hidden = false;
    dMsg.textContent = ''; dMsg.className = '';
    fillDetail(it);
    for (const [eid, e] of entities) e.point.pixelSize = eid === id ? 16 : 12;
    const e = entities.get(id);
    if (e && viewer.selectedEntity !== e) viewer.selectedEntity = e;
    if (fly && e) flyTo(e);
    renderList();
  }
  function deselect() {
    selectedId = null; dEl.hidden = true;
    for (const e of entities.values()) e.point.pixelSize = 12;
    if (viewer.selectedEntity) viewer.selectedEntity = undefined;
    renderList();
  }
  const flyTo = (e) => viewer.flyTo(e, { duration: 1.2,
    offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-40), 400) });

  viewer.selectedEntityChanged.addEventListener((e) => {
    if (e) { if (String(e.id) !== selectedId) select(String(e.id), false); }
    else if (selectedId) deselect();
  });

  $('dClose').addEventListener('click', deselect);
  $('dFly').addEventListener('click', () => { const e = entities.get(selectedId); if (e) flyTo(e); });

  dDelete.addEventListener('click', async () => {
    const it = items.find((i) => i.id === selectedId);
    if (!it) return;
    if (!window.confirm(`Obrisati marker "${it.name}" na serveru?\nOvo ga uklanja svima.`)) return;
    dDelete.disabled = true; dMsg.className = ''; dMsg.textContent = 'Šaljem…';
    try {
      const r = await fetch('/api/delete-marker', { method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-TAK-App': '1' },
        body: JSON.stringify({ id: it.id }) });
      const j = await r.json();
      if (j.ok) { deselect(); }
      else {
        const sent = j.sent ? `${j.sent.method} ${j.sent.path}` : '';
        dMsg.className = 'err';
        dMsg.textContent = `Brisanje nije uspjelo (${j.error || 'HTTP ' + j.status}). ` +
          (sent ? `Poslano: ${sent}. ` : '') + (j.response ? `Odgovor: ${JSON.stringify(j.response)}` : '');
      }
    } catch (e) { dMsg.className = 'err'; dMsg.textContent = 'Greška: ' + e.message; }
    dDelete.disabled = false;
  });

  // ---- kontrole panela ----
  $('search').addEventListener('input', (e) => { query = e.target.value; renderList(); });
  $('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    for (const x of $('tabs').children) x.classList.toggle('on', x === b);
    renderList();
  });
  $('stale').addEventListener('change', (e) => {
    showStale = e.target.checked;
    for (const it of items) {
      if (isVisible(it)) upsert(it);
      else if (entities.has(it.id)) { viewer.entities.remove(entities.get(it.id)); entities.delete(it.id); }
    }
    if (selectedId && !isVisible(items.find((i) => i.id === selectedId) || {})) deselect(); else renderList();
  });
  $('collapse').addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    $('collapse').textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
  });
  function fitAll() {
    if (!entities.size) return;
    viewer.flyTo([...entities.values()], { duration: 1.5,
      offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-45), 0) });
  }
  $('zoomAll').addEventListener('click', fitAll);

  // ---- osvjezavanje ----
  function setPill(cls, text) { pill.className = 'pill ' + cls; pillText.textContent = text; }

  async function poll() {
    try {
      const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
      items = s.items || [];
      const vis = items.filter(isVisible);
      const seen = new Set();
      for (const it of vis) { upsert(it); seen.add(it.id); }
      for (const [id, e] of entities) if (!seen.has(id)) { viewer.entities.remove(e); entities.delete(id); }

      const failed = Object.entries(s.sources || {}).filter(([, v]) => v.error || v.status >= 400);
      if (failed.length === Object.keys(s.sources || {}).length && failed.length) {
        setPill('bad', 'OTS nedostupan');
        banner.hidden = false;
        banner.textContent = s.error || 'Server ne odgovara. Provjeri ZeroTier i prijavu u .env.';
      } else {
        setPill('ok', `${vis.length} ${vis.length === 1 ? 'objekt' : 'objekata'}`);
        if (failed.length) { banner.hidden = false; banner.textContent = `Ne radi: ${failed.map(([p]) => p).join(', ')}`; }
        else if (hasToken) banner.hidden = true;
      }
      $('upd').textContent = 'Osvježeno ' + new Date().toLocaleTimeString('hr-HR');
      if (selectedId) {
        const it = items.find((i) => i.id === selectedId);
        if (it && isVisible(it)) fillDetail(it); else deselect();
      }
      renderList();
      if (firstFit && items.length) { firstFit = false; fitAll(); }
    } catch (e) {
      setPill('bad', 'Backend nedostupan');
      banner.hidden = false; banner.textContent = e.message;
    }
    setTimeout(poll, cfg.pollMs || 2000);
  }
  if (!hasToken) { banner.hidden = false; banner.textContent = 'Nema CESIUM_ION_TOKEN: ravna karta bez terena i zgrada.'; }
  poll();
})();
</script>
</body>
</html>
